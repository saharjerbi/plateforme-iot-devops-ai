services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./docs_rag:/app/docs_rag:ro
      - ./rag_db:/app/rag_db

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"  # WebSocket MQTT pour le frontend React
    volumes:
      - ./mosquitto/config:/mosquitto/config

  simulateur:
    image: python:3.11-slim
    command: python simulateur/simulateur_dht22.py
    volumes:
      - ./simulateur:/simulateur
      - ./pont-mqtt:/pont-mqtt
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto

  mqtt-bridge:
    image: python:3.11-slim
    command: pip install paho-mqtt influxdb-client && python pont-mqtt/mqtt_to_influxdb.py
    volumes:
      - ./pont-mqtt:/pont-mqtt
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_TOKEN=iot-token-2024
      - INFLUXDB_ORG=iot-org
      - INFLUXDB_BUCKET=capteurs
      - MODE=production
    depends_on:
      - mosquitto
      - influxdb

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=motdepasse123
      - DOCKER_INFLUXDB_INIT_ORG=iot-org
      - DOCKER_INFLUXDB_INIT_BUCKET=capteurs
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iot-token-2024
    volumes:
      - influx_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

volumes:
  influx_data:
  rag_db:
